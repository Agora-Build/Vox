services:
  postgres:
    image: postgres:15-alpine
    container_name: vox-postgres
    environment:
      POSTGRES_USER: vox
      POSTGRES_PASSWORD: vox123
      POSTGRES_DB: vox
    ports:
      - "5432:5432"
    volumes:
      - vox_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vox -d vox"]
      interval: 5s
      timeout: 5s
      retries: 5

  vox-service:
    image: vox-service:${VOX_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vox-service
    environment:
      DATABASE_URL: postgresql://vox:vox123@postgres:5432/vox
      SESSION_SECRET: ${SESSION_SECRET:-local-test-secret-123}
      INIT_CODE: ${INIT_CODE:-VOX-DEBUG-2024}
      NODE_ENV: development
      COOKIE_SECURE: "false"  # Allow cookies over HTTP for local development
      # Disable API rate limiting for local dev only. The bundle bakes
      # NODE_ENV=production at build time, so the built server can't tell this
      # dev container from prod and would otherwise 429 test/dev traffic. Read
      # at runtime; prod never sets it, so prod rate limiting stays on.
      RATE_LIMIT_DISABLED: "true"
      VOX_PLUGINS: ${VOX_PLUGINS:-credits,shared-agents}
      PORT: 5000
      # AES-256-GCM key for secret encryption. Compose only injects what is
      # listed here, so without this line the Docker server runs WITHOUT a key
      # and the secrets/session feature is dead. Must match the value used by
      # any direct-DB tooling on the host.
      CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy

  # Session broker — stateless trusted sidecar, its own lean image built from the
  # Dockerfile's `broker` target (aeval + aeval-data + Chromium only; no
  # voice-agent-tester, no daemon code). It mints a Playwright storageState by
  # driving aeval's `setup:account` flow with the login credential Core passes
  # over the internal network. NO ports are published: only vox-service (same
  # compose network) may reach it.
  auth-session-broker:
    image: vox-auth-session-broker:latest
    build:
      context: .
      dockerfile: vox_eval_agentd/Dockerfile
      target: broker
    container_name: vox-auth-session-broker
    environment:
      # The broker self-registers with Core (register/heartbeat) instead of
      # Core holding a static broker URL/secret. BROKER_REG_TOKEN must be an
      # admin-minted registration token (POST /api/admin/broker-tokens as an
      # admin) — there is no safe default, so it is left unset here; set it
      # via a .env override before bringing this service up.
      VOX_CORE_URL: ${VOX_CORE_URL:-http://vox-service:5000}
      BROKER_REG_TOKEN: ${BROKER_REG_TOKEN:-}
      BROKER_ADVERTISE_URL: ${BROKER_ADVERTISE_URL:-http://auth-session-broker:8200}
      BROKER_PORT: 8200
      HEADLESS: "true"
      WEB_SESSION_MINT_TIMEOUT_SECONDS: ${WEB_SESSION_MINT_TIMEOUT_SECONDS:-180}

  # eval-agent:
  #   build:
  #     context: vox_eval_agentd
  #     dockerfile: vox_eval_agentd/Dockerfile
  #     target: daemon   # default (last) stage; explicit for clarity
  #   container_name: vox-eval-agent
  #   environment:
  #     AGENT_TOKEN: <token>
  #     VOX_SERVER: http://vox-service:5000
  #     EVAL_FRAMEWORK: aeval   # or "voice-agent-tester"
  #   # aeval >=0.4 records/plays through a virtual ALSA soundcard. The HOST
  #   # must load it first (a container cannot modprobe):
  #   #   sudo modprobe snd-aloop id=VirtualAudio pcm_substreams=1
  #   devices:
  #     - /dev/snd:/dev/snd
  #   depends_on:
  #     vox-service:
  #       condition: service_started

volumes:
  vox_postgres_data:
