openapi: 3.0.3
info:
  title: Vox API
  description: |
    The REST API for Vox, the AI latency evaluation platform: manage eval flows and eval sets,
    run and inspect jobs, and read metrics for conversational AI agents.

    ## The two Vox APIs

    - **REST (this document)** — available now. Everything here is served under `/api/v1` and
      authenticated with a `vox_live_` API key. Evals run on Vox-managed or self-hosted eval
      agents; you schedule and read results over HTTP.
    - **Native** — *planned, not available yet.* An interface for building evals and running
      them locally, against your own agent, without round-tripping through this service. It is
      on the roadmap and deliberately absent here; nothing in this document depends on it.

    ## Scope

    This document covers the **v1 key-authenticated API only**. The Vox console calls a larger
    set of session-authenticated endpoints under `/api/*` (agent tokens, community and
    my-evals metrics, org and billing management). Those are internal to the console, are not
    versioned, and may change without notice — they are intentionally not documented here.

    ## Getting started

    **1. Get an API key.** Sign in at https://vox.agora.build, then open
    **Console → API Keys** (https://vox.agora.build/console/api-keys) and create one. The key
    is shown **once, at creation** — copy it then; it is stored only as a SHA-256 hash and
    cannot be retrieved later. Lost a key? Revoke it and create another.

    **2. Check it works.** `GET /user` is the cheapest authenticated call:

    ```bash
    curl -H "Authorization: Bearer vox_live_xxxxx" \
      https://vox.agora.build/api/v1/user
    ```

    **3. Understand the three objects** before you run anything:

    | Object | What it is | Who owns the content |
    |---|---|---|
    | **Eval flow** | How to reach the agent — provider, evaluation mode (web or phone), and the Setup/Teardown steps that connect and hang up | you |
    | **Eval set** | What to say — the conversation the eval runs, as a scenario | you, or a public/built-in one |
    | **Job** | One execution of an eval flow against an eval set, on one agent, in one region | created by a run |

    **4. Run one.** `POST /eval-flows/{id}/run` takes an `evalSetId` plus where to run
    (`region` + `targetTier`), and returns the created job. Poll `GET /jobs/{id}` for status,
    then `GET /results?jobId=…` for the metrics once it completes.

    ## Authentication

    Every endpoint in this document requires a `vox_live_` API key as a Bearer token:

    ```
    Authorization: Bearer vox_live_xxxxx
    ```

    A key carries the permissions of the user who created it. Requests without one get `401`;
    requests for another user's private resource get `403`.

    ## Rate Limiting

    In production, API requests are rate limited to 100 requests per 15 minutes. Login and
    registration endpoints carry a stricter limit of 20 per 15 minutes.

    ## Response Format

    All successful responses follow this format:
    ```json
    {
      "data": { ... },
      "meta": { "total": 10, ... }
    }
    ```

    Error responses follow this format:
    ```json
    {
      "error": "Error message here"
    }
    ```
  version: 1.0.0
  contact:
    name: Vox Support
    url: https://github.com/Agora-Build/Vox
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: http://localhost:5000/api/v1
    description: Local development server
  - url: https://vox.agora.build/api/v1
    description: Production server

tags:
  - name: Eval Flows
    description: Manage how evaluations reach each agent
  - name: Eval Sets
    description: Manage evaluation test sets
  - name: Jobs
    description: Manage evaluation jobs
  - name: Results
    description: Access evaluation results
  - name: Projects
    description: Manage projects
  - name: Metrics
    description: >
      Public and private metrics across three tiers: Mainline (official benchmarks),
      Community (public non-mainline results), and My Evals (user's private results).
  - name: Eval Agent Tokens
    description: >
      Manage eval agent tokens. Admin users can create public or private tokens.
      Premium/Principal/Fellow users can create private tokens only. Basic users cannot create tokens.
  - name: Providers
    description: AI provider information
  - name: User
    description: User account information

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: API key with prefix `vox_live_`

  schemas:
    Error:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          example: "Authentication required"

    EvalAgentToken:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        siteId:
          type: string
        visibility:
          type: string
          enum: [public, private]
        isRevoked:
          type: boolean
        lastUsedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        createdBy:
          type: integer

    User:
      type: object
      properties:
        id:
          type: integer
          example: 1
        username:
          type: string
          example: "johndoe"
        email:
          type: string
          format: email
          example: "john@agora.build"
        plan:
          type: string
          enum: [basic, premium, principal, fellow]
          example: "premium"
        organizationId:
          type: integer
          nullable: true
          example: 1
        isOrgAdmin:
          type: boolean
          example: false

    EvalFlow:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: "Latency Test - Production"
        description:
          type: string
          nullable: true
          example: "Tests response latency for production environment"
        ownerId:
          type: integer
          example: 1
        projectId:
          type: integer
          nullable: true
          example: 1
        providerId:
          type: string
          example: "abc123def456"
        visibility:
          type: string
          enum: [public, private]
          example: "public"
        isMainline:
          type: boolean
          example: false
        config:
          type: object
          additionalProperties: true
          example: {}
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    EvalFlowCreate:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          example: "Latency Test - Production"
        description:
          type: string
          example: "Tests response latency for production environment"
        providerId:
          type: string
          example: "abc123def456"
        projectId:
          type: integer
          example: 1
        visibility:
          type: string
          enum: [public, private]
          default: "public"
        config:
          type: object
          additionalProperties: true

    EvalFlowUpdate:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        visibility:
          type: string
          enum: [public, private]
        config:
          type: object
          additionalProperties: true

    EvalSet:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: "Appointment Scheduling Test Suite"
        description:
          type: string
          nullable: true
        ownerId:
          type: integer
          example: 1
        visibility:
          type: string
          enum: [public, private]
          example: "public"
        isMainline:
          type: boolean
          example: false
        config:
          type: object
          additionalProperties: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    EvalSetCreate:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          example: "Appointment Scheduling Test Suite"
        description:
          type: string
        visibility:
          type: string
          enum: [public, private]
          default: "public"
        config:
          type: object
          additionalProperties: true

    EvalJob:
      type: object
      properties:
        id:
          type: integer
          example: 1
        evalFlowId:
          type: integer
          example: 1
        evalSetId:
          type: integer
          nullable: true
          example: 1
        evalAgentId:
          type: integer
          nullable: true
          example: 1
        siteId:
          type: string
          nullable: true
          description: Concrete site that ran (or will run) the job. Null while a pooled job is pending; stamped by the claiming agent.
          example: "na-us-seattle-02"
        targetRegion:
          type: string
          nullable: true
          description: Region baseId of the pool this job targets (null for targeted or legacy jobs).
          example: "na-us-seattle"
        targetTier:
          type: string
          nullable: true
          enum: [private, team, public, shared]
          description: Agent tier of the pool this job targets (null for targeted or legacy jobs; "shared" is reserved).
          example: "public"
        status:
          type: string
          enum: [pending, running, completed, failed]
          example: "pending"
        priority:
          type: integer
          example: 0
        retryCount:
          type: integer
          example: 0
        maxRetries:
          type: integer
          example: 3
        startedAt:
          type: string
          format: date-time
          nullable: true
        completedAt:
          type: string
          format: date-time
          nullable: true
        error:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    RunEvalFlowRequest:
      type: object
      required:
        - region
        - targetTier
        - evalSetId
      properties:
        region:
          type: string
          description: >-
            Region location baseId to dispatch into (must be an active
            region_locations.baseId). The job waits in this region×tier pool
            until a qualified agent claims it (no fast-fail — bounded only by
            the 24h pending backstop).
          example: "na-us-seattle"
        targetTier:
          type: string
          description: >-
            Which pool of agents may claim the job. `private` = only your own
            agents. `team` = your organization's agents (requires org
            membership). `public` = any public agent. `shared` (paid,
            marketplace) is not yet available for pooled dispatch and is
            rejected with 400.
          enum: [private, team, public, shared]
          example: "public"
        evalSetId:
          type: integer
          nullable: true
        priority:
          type: integer
          default: 0

    EvalResult:
      type: object
      properties:
        id:
          type: integer
          example: 1
        evalJobId:
          type: integer
          example: 1
        providerId:
          type: string
          example: "abc123def456"
        siteId:
          type: string
          example: "na-us-seattle-02"
        responseLatencyMedian:
          type: integer
          description: "Median response latency in milliseconds"
          example: 250
        responseLatencySd:
          type: number
          description: "Standard deviation of response latency"
          example: 45.2
        interruptLatencyMedian:
          type: integer
          description: "Median interrupt latency in milliseconds"
          example: 150
        interruptLatencySd:
          type: number
          description: "Standard deviation of interrupt latency"
          example: 30.5
        networkResilience:
          type: integer
          nullable: true
          description: "Network resilience score (0-100)"
          example: 85
        naturalness:
          type: number
          nullable: true
          description: "Naturalness score (0-5)"
          example: 4.2
        noiseReduction:
          type: integer
          nullable: true
          description: "Noise reduction score (0-100)"
          example: 90
        rawData:
          type: object
          additionalProperties: true
        createdAt:
          type: string
          format: date-time

    Project:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: "Production Tests"
        description:
          type: string
          nullable: true
        ownerId:
          type: integer
          example: 1
        organizationId:
          type: integer
          nullable: true
        evalFlowCount:
          type: integer
          example: 5
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ProjectCreate:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          example: "Production Tests"
        description:
          type: string

    Provider:
      type: object
      properties:
        id:
          type: string
          example: "abc123def456"
        name:
          type: string
          example: "Agora ConvoAI Engine"
        sku:
          type: string
          enum: [convoai, rtc]
          example: "convoai"
        description:
          type: string
          nullable: true
        isActive:
          type: boolean
          example: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    RealtimeMetric:
      type: object
      properties:
        id:
          type: integer
          example: 1
        provider:
          type: string
          example: "abc123def456"
        siteId:
          type: string
          example: "na-us-seattle-02"
        responseLatency:
          type: integer
          example: 250
        interruptLatency:
          type: integer
          example: 150
        networkResilience:
          type: integer
          nullable: true
          example: 85
        naturalness:
          type: number
          nullable: true
          example: 4.2
        noiseReduction:
          type: integer
          nullable: true
          example: 90
        timestamp:
          type: string
          format: date-time

    LeaderboardEntry:
      type: object
      properties:
        rank:
          type: integer
          example: 1
        provider:
          type: string
          example: "abc123def456"
        siteId:
          type: string
          example: "na-us-seattle-02"
        responseLatency:
          type: integer
          example: 250
        interruptLatency:
          type: integer
          example: 150
        networkResilience:
          type: integer
          example: 85
        naturalness:
          type: number
          example: 4.2
        noiseReduction:
          type: integer
          example: 90

paths:
  /eval-flows:
    get:
      tags:
        - Eval Flows
      summary: List eval flows
      description: Returns all eval flows accessible to the authenticated user
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of eval flows
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/EvalFlow'
                  meta:
                    type: object
                    properties:
                      total:
                        type: integer
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    post:
      tags:
        - Eval Flows
      summary: Create eval flow
      description: Creates a new eval flow
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EvalFlowCreate'
      responses:
        '201':
          description: Eval Flow created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/EvalFlow'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Plan limit reached or feature not available
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /eval-flows/{id}:
    get:
      tags:
        - Eval Flows
      summary: Get eval flow
      description: Returns a specific eval flow by ID
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: EvalFlow details
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/EvalFlow'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Eval Flow not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    put:
      tags:
        - Eval Flows
      summary: Update eval flow
      description: Updates an existing eval flow (owner only)
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EvalFlowUpdate'
      responses:
        '200':
          description: Eval Flow updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/EvalFlow'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Not authorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Eval Flow not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    delete:
      tags:
        - Eval Flows
      summary: Delete eval flow
      description: Deletes an eval flow (owner only)
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Eval Flow deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Not authorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Eval Flow not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /eval-flows/{id}/run:
    post:
      tags:
        - Eval Flows
      summary: Run eval flow
      description: Creates an eval job to run the eval flow
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RunEvalFlowRequest'
      responses:
        '201':
          description: Job created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      job:
                        $ref: '#/components/schemas/EvalJob'
                      message:
                        type: string
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Not authorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Eval Flow not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /eval-sets:
    get:
      tags:
        - Eval Sets
      summary: List eval sets
      description: Returns all eval sets accessible to the authenticated user
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of eval sets
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/EvalSet'
                  meta:
                    type: object
                    properties:
                      total:
                        type: integer
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    post:
      tags:
        - Eval Sets
      summary: Create eval set
      description: Creates a new eval set
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EvalSetCreate'
      responses:
        '201':
          description: Eval set created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/EvalSet'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Plan limit reached
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /eval-sets/{id}:
    get:
      tags:
        - Eval Sets
      summary: Get eval set
      description: Returns a specific eval set by ID
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Eval set details
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/EvalSet'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Eval set not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /jobs:
    get:
      tags:
        - Jobs
      summary: List jobs
      description: Returns eval jobs for the authenticated user
      security:
        - BearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, running, completed, failed]
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: List of jobs
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/EvalJob'
                  meta:
                    type: object
                    properties:
                      limit:
                        type: integer
                      offset:
                        type: integer
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /jobs/{id}:
    get:
      tags:
        - Jobs
      summary: Get job
      description: Returns a specific job by ID
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Job details
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/EvalJob'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Job not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    delete:
      tags:
        - Jobs
      summary: Cancel job
      description: Cancels a pending job
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Job cancelled
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
        '400':
          description: Job cannot be cancelled (not pending)
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  currentStatus:
                    type: string
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Job not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /results:
    get:
      tags:
        - Results
      summary: List results
      description: Returns eval results for the authenticated user
      security:
        - BearerAuth: []
      parameters:
        - name: evalFlowId
          in: query
          schema:
            type: integer
        - name: jobId
          in: query
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: List of results
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/EvalResult'
                  meta:
                    type: object
                    properties:
                      limit:
                        type: integer
                      offset:
                        type: integer
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /results/{id}:
    get:
      tags:
        - Results
      summary: Get result
      description: Returns a specific result by ID
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Result details
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/EvalResult'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Result not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /projects:
    get:
      tags:
        - Projects
      summary: List projects
      description: Returns all projects for the authenticated user
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of projects
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Project'
                  meta:
                    type: object
                    properties:
                      total:
                        type: integer
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    post:
      tags:
        - Projects
      summary: Create project
      description: Creates a new project
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectCreate'
      responses:
        '201':
          description: Project created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Project'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Plan limit reached
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /metrics/realtime:
    get:
      tags:
        - Metrics
      summary: Get mainline metrics
      description: >
        Returns recent evaluation metrics for the Mainline tier (public endpoint).
        Only includes results where the eval flow is public+mainline, the eval set is
        public+mainline, and the agent token is public.
      security: []   # public — no API key required
      parameters:
        - name: hours
          in: query
          schema:
            type: integer
          description: Number of hours to look back (optional)
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
          description: Maximum number of results to return
      responses:
        '200':
          description: Mainline realtime metrics
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/RealtimeMetric'
                  meta:
                    type: object
                    properties:
                      timestamp:
                        type: string
                        format: date-time
                      count:
                        type: integer

  /metrics/leaderboard:
    get:
      tags:
        - Metrics
      summary: Get leaderboard
      description: Returns aggregated provider rankings (public endpoint)
      security: []   # public — no API key required
      parameters:
        - name: siteId
          in: query
          schema:
            type: string
          description: An exact allocated site id, e.g. na-us-seattle-02
      responses:
        '200':
          description: Leaderboard data
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/LeaderboardEntry'
                  meta:
                    type: object
                    properties:
                      timestamp:
                        type: string
                        format: date-time
                      siteId:
                        type: string
                      count:
                        type: integer

  /providers:
    get:
      tags:
        - Providers
      summary: List providers
      description: Returns all active providers (public endpoint)
      security: []   # public — no API key required
      responses:
        '200':
          description: List of providers
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Provider'
                  meta:
                    type: object
                    properties:
                      total:
                        type: integer

  /user:
    get:
      tags:
        - User
      summary: Get current user
      description: Returns information about the authenticated user (useful for API key validation)
      security:
        - BearerAuth: []
      responses:
        '200':
          description: User information
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/User'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
