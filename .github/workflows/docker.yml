name: Build & Publish Docker Images

on:
  # On push to main: build AND publish (post-merge, the source of truth).
  push:
    branches:
      - main
    paths: &image-paths
      - 'Dockerfile'
      - 'server/**'
      - 'client/**'
      - 'shared/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'vite.config.ts'
      - 'drizzle.config.ts'
      - 'vox_eval_agentd/**'
      - 'vox_clash_runner/**'
      - '.dockerignore'
      - '.github/workflows/docker.yml'
  # On a PR into main: build + smoke test only, NEVER push. This gates a
  # broken Dockerfile (e.g. a missing COPY) BEFORE merge, instead of only
  # turning main red in the post-merge publish. Login/push steps below are
  # guarded on `github.event_name != 'pull_request'`.
  pull_request:
    branches:
      - main
    paths: *image-paths

# A newer commit on the same PR (or main) supersedes older in-flight builds.
# Only cancel PR runs — never cancel a main publish partway through.
concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      vox-service: ${{ steps.filter.outputs.vox-service }}
      vox-eval-agentd: ${{ steps.filter.outputs.vox-eval-agentd }}
      vox-clash-runner: ${{ steps.filter.outputs.vox-clash-runner }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect changed paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            # The workflow file itself affects how every image is built —
            # changing it must rebuild all images.
            vox-service:
              - 'Dockerfile'
              - 'server/**'
              - 'client/**'
              - 'shared/**'
              - 'package.json'
              - 'package-lock.json'
              - 'tsconfig.json'
              - 'vite.config.ts'
              - 'drizzle.config.ts'
              - '.github/workflows/docker.yml'
            vox-eval-agentd:
              - 'vox_eval_agentd/**'
              - 'shared/**'
              - '.dockerignore'
              - '.github/workflows/docker.yml'
            vox-clash-runner:
              - 'vox_clash_runner/**'
              - 'shared/**'
              - '.dockerignore'
              - '.github/workflows/docker.yml'

  build-vox-service:
    needs: changes
    if: needs.changes.outputs.vox-service == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/vox
          tags: |
            type=sha,prefix=
            type=raw,value=latest

      - name: Build (and push on main)
        uses: docker/build-push-action@v6
        with:
          context: .
          # PRs build to validate the Dockerfile but never publish.
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  build-vox-eval-agentd:
    needs: changes
    if: needs.changes.outputs.vox-eval-agentd == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Record aeval-data commit for image labels
        id: aeval
        run: |
          # The image bakes in aeval-data (corpus/config) at the commit the
          # submodule pins — checked out above. AEVAL_VERSION in the Dockerfile
          # only selects the aeval BINARY; it no longer overrides the data.
          # To update the corpus: bump the submodule. To update the binary:
          # bump AEVAL_VERSION.
          cd vox_eval_agentd/aeval-data
          echo "commit=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "date=$(git log -1 --format=%ci)" >> "$GITHUB_OUTPUT"
          echo "aeval-data at pinned submodule commit $(git rev-parse --short HEAD)"

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/vox-eval-agentd
          tags: |
            type=sha,prefix=
            type=raw,value=latest

      - name: Extract broker metadata
        id: meta-broker
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/vox-auth-session-broker
          tags: |
            type=sha,prefix=
            type=raw,value=latest

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./vox_eval_agentd/Dockerfile
          target: daemon
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_TAG=${{ github.ref_name }}/${{ github.sha }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            AEVAL_DATA_COMMIT=${{ steps.aeval.outputs.commit }}
            AEVAL_DATA_DATE=${{ steps.aeval.outputs.date }}

      - name: Smoke test eval agent image
        run: |
          IMAGE_TAG=$(echo '${{ steps.meta.outputs.tags }}' | head -n1)
          docker run --rm "$IMAGE_TAG" bash -c "
            echo '=== Node ===' && node --version &&
            echo '=== aeval ===' && aeval --version &&
            echo '=== Chrome ===' && cd /app/voice-agent-tester &&
              node -e \"const p=require('puppeteer'); const b=p.executablePath();
              require('child_process').execSync(b+' --version --no-sandbox',{stdio:'inherit'})\" &&
            echo '=== Daemon syntax ===' && node --check /app/vox-agentd.js &&
            echo 'All smoke tests passed'
          "

      - name: Smoke test container audio (soundcard mode)
        run: |
          # Exercise the image the way production runs it: host snd-aloop card
          # passed through with --device /dev/snd + systempaths=unconfined
          # (Docker masks /proc/asound by default; aeval reads it to resolve
          # the card — the mask is exactly what broke the 0.4.1 rollout).
          IMAGE_TAG=$(echo '${{ steps.meta.outputs.tags }}' | head -n1)
          sudo apt-get update -qq && sudo apt-get install -y -qq "linux-modules-extra-$(uname -r)" > /dev/null || true
          if ! sudo modprobe snd-aloop id=VirtualAudio pcm_substreams=1; then
            echo "::warning::snd-aloop unavailable on this runner kernel — container audio check skipped"
            exit 0
          fi
          docker run --rm --device /dev/snd --security-opt systempaths=unconfined "$IMAGE_TAG" bash -c "
            echo '=== /proc/asound visible ===' &&
            grep VirtualAudio /proc/asound/cards &&
            echo '=== ALSA playback ===' &&
            aplay -D hw:VirtualAudio,0 -f S16_LE -r 48000 -c 2 -d 1 /dev/zero &&
            echo 'Container audio OK'
          "

      - name: Build broker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./vox_eval_agentd/Dockerfile
          target: broker
          load: true
          tags: ${{ steps.meta-broker.outputs.tags }}
          labels: ${{ steps.meta-broker.outputs.labels }}
          build-args: |
            BUILD_TAG=${{ github.ref_name }}/${{ github.sha }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            AEVAL_DATA_COMMIT=${{ steps.aeval.outputs.commit }}
            AEVAL_DATA_DATE=${{ steps.aeval.outputs.date }}

      - name: Smoke test broker image
        run: |
          IMAGE_TAG=$(echo '${{ steps.meta-broker.outputs.tags }}' | head -n1)
          docker run --rm "$IMAGE_TAG" bash -c "
            echo '=== Node ===' && node --version &&
            echo '=== aeval ===' && aeval --version &&
            echo '=== Broker syntax ===' && node --check /app/auth-session-broker.js &&
            echo 'All smoke tests passed'
          "

      - name: Push image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./vox_eval_agentd/Dockerfile
          target: daemon
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_TAG=${{ github.ref_name }}/${{ github.sha }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            AEVAL_DATA_COMMIT=${{ steps.aeval.outputs.commit }}
            AEVAL_DATA_DATE=${{ steps.aeval.outputs.date }}

      - name: Push broker image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./vox_eval_agentd/Dockerfile
          target: broker
          push: true
          tags: ${{ steps.meta-broker.outputs.tags }}
          labels: ${{ steps.meta-broker.outputs.labels }}
          build-args: |
            BUILD_TAG=${{ github.ref_name }}/${{ github.sha }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            AEVAL_DATA_COMMIT=${{ steps.aeval.outputs.commit }}
            AEVAL_DATA_DATE=${{ steps.aeval.outputs.date }}

  build-vox-clash-runner:
    needs: changes
    if: needs.changes.outputs.vox-clash-runner == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/vox-clash-runner
          tags: |
            type=sha,prefix=
            type=raw,value=latest

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./vox_clash_runner/Dockerfile
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_TAG=${{ github.ref_name }}/${{ github.sha }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}

      - name: Smoke test clash runner image
        run: |
          IMAGE_TAG=$(echo '${{ steps.meta.outputs.tags }}' | head -n1)
          docker run --rm "$IMAGE_TAG" bash -c "
            echo '=== Node ===' && node --version &&
            echo '=== Chromium ===' && node -e \"const {chromium}=require('playwright-core'); console.log('playwright-core ok')\" &&
            echo '=== Runner syntax ===' && node --check /app/clash-runner.js &&
            echo 'All smoke tests passed'
          "

      - name: Push image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./vox_clash_runner/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_TAG=${{ github.ref_name }}/${{ github.sha }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
